<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrarium</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌱 Terrarium</h1>
    <p class="tagline">A tiny digital ecosystem. Watch it live, day by day.</p>
  </header>

  <main>
    <canvas id="world" width="900" height="560"></canvas>

    <aside id="panel">
      <div class="stat-row">
        <span class="stat-label">Day</span>
        <span id="stat-day" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Time</span>
        <span id="stat-time" class="stat-value">☀️ 100%</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Plants</span>
        <span id="stat-plants" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Herbivores</span>
        <span id="stat-herbivores" class="stat-value">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Avg. Energy</span>
        <span id="stat-energy" class="stat-value">0</span>
      </div>

      <div class="controls">
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset</button>
        <label class="speed-label">
          Speed
          <input id="speed" type="range" min="1" max="4" value="1" step="1">
        </label>
      </div>

      <div id="roadmap">
        <h2>7-day build log</h2>
        <ol id="roadmap-list"></ol>
      </div>
    </aside>
  </main>

  <script src="roadmap.js"></script>
  <script src="terrarium.js"></script>
</body>
</html>
